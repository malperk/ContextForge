[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextforge-rag"
version = "0.1.0"
description = "Reproducible, grounded retrieval-augmented generation with retrieval evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.3"]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
semantic = ["sentence-transformers>=3.0"]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
contextforge = "contextforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
